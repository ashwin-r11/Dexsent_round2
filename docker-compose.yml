services:
  ros2-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_humble_dev
    
    # Allow GUI apps (RViz, Gazebo)
    environment:
      - DISPLAY=:1
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    
    # X11 forwarding for GUI
    volumes:
      # Mount your source code
      - ./src:/ros2_ws/src
      # X11 socket for display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # For X11 auth
      - ~/.Xauthority:/root/.Xauthority:rw
    
    # Network mode for ROS2 communication
    network_mode: host
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Privileged mode for hardware access
    privileged: true
