services:
  ros2-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_humble_dev
    
    # Allow GUI apps (RViz, Gazebo)
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    
    # X11 forwarding for GUI
    volumes:
      # Mount your source code
      - ./src:/ros2_ws/src
      # X11 socket for display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # GPU support (optional)
      - /dev/dri:/dev/dri
    
    # Network mode for ROS2 communication
    network_mode: host
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Run as current user (avoids permission issues)
    user: "${UID:-1000}:${GID:-1000}"
    
    # Privileged mode for hardware access (optional)
    privileged: true
